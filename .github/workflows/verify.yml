name: Verify preprint artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B scripts/test_text_encoding.py -v
      - run: python -B scripts/verify_release.py
